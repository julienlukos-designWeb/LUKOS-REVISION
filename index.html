<script>
const SUPABASE_URL="https://sxsjnqpgnfomvtbpwhvy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_eknRWQ2LiNW_LygVdDU0hg_xLUsWZd4";
const QUESTIONS=[];
const QUESTION_CACHE={DAP:null,DQEG:null};
const PDF_FILES={DAP:"QUESTIONNAIRE-DAP.pdf",DQEG:"QUESTIONNAIRE-DQEG.pdf"};
let activePdfUrl=null;
function closePdfReader(){const m=document.getElementById("lukosPdfReader");if(m)m.remove();if(activePdfUrl){URL.revokeObjectURL(activePdfUrl);activePdfUrl=null;}}
async function getPdfBlobUrl(file){
  const {data,error}=await sb.storage.from("lukos-lecture").createSignedUrl(file,120);
  if(error||!data||!data.signedUrl)throw (error||new Error("Document introuvable"));
  const res=await fetch(data.signedUrl);
  if(!res.ok)throw new Error("Téléchargement impossible ("+res.status+")");
  const blob=await res.blob();
  return URL.createObjectURL(new Blob([blob],{type:"application/pdf"}));
}
async function openEmbeddedPdf(kind,label){
  if(!(requireActive()||state.isAdmin)){alert("Accès réservé aux comptes actifs.");return;}
  const file=PDF_FILES[kind];
  if(!file){alert("Document indisponible.");return;}
  /* Pont Android natif éventuel */
  if(window.Android?.openPdfAsset){
    try{ window.Android.openPdfAsset(label); return; }catch(e){}
  }
  closePdfReader();
  /* La fenêtre est ouverte tout de suite (geste utilisateur) pour éviter le blocage des popups. */
  let opened=null;
  try{opened=window.open("","_blank");if(opened)opened.document.write("<p style=\"font-family:Arial;padding:20px\">Chargement du document…</p>");}catch(e){}
  try{ activePdfUrl=await getPdfBlobUrl(file); }
  catch(e){ if(opened)try{opened.close()}catch(_){} alert("Le document "+label+" n'est pas disponible pour le moment. Vérifie ta connexion Internet ou contacte l'administrateur."); return; }
  if(opened){
    opened.location.href=activePdfUrl;
    setTimeout(()=>{try{URL.revokeObjectURL(activePdfUrl)}catch(e){} activePdfUrl=null;},120000);
    return;
  }
  /* Fallback : lecteur intégré */
  const modal=document.createElement("div"); modal.id="lukosPdfReader";
  modal.innerHTML=`<div class="pdf-reader-backdrop"><div class="pdf-reader-shell"><div class="pdf-reader-head"><div><b>📖 LUKOS RÉVISION</b><span>${label} — Mode lecture</span></div><div style="display:flex;gap:8px"><a class="secondary" href="${activePdfUrl}" target="_blank" rel="noopener">↗ Ouvrir le PDF</a><button id="closePdfReader" class="secondary">✕ Fermer</button></div></div><iframe class="pdf-reader-frame" src="${activePdfUrl}#toolbar=1&navpanes=1&view=FitH" title="${label} PDF"></iframe></div></div>`;
  document.body.appendChild(modal);
  document.getElementById("closePdfReader").onclick=closePdfReader;
  modal.querySelector(".pdf-reader-backdrop").onclick=e=>{if(e.target.classList.contains("pdf-reader-backdrop"))closePdfReader();};
}

const PDF_SUBJECTS={DAP:["MAINTIEN DE L’ORDRE","ORGANISATION ET STATUT","DROIT ET DEVOIR","POLICE JUDICIAIRE MILITAIRE","SERVICE DE LA GENDARMERIE","POLICE ADMINISTRATIVE","SERVICE INTERIEUR","POLICE DE LA ROUTE","METHODES ET TECHNIQUES","POLICE JUDICIAIRE","GEOGRAPHIE"],DQEG:["DROIT PENAL GENERAL","DROIT PENAL SPECIAL","DROIT ET DEVOIRS","PROCEDURE PENALE THEORIQUE","PROCEDURE PENALE PRATIQUE","POLICE ADMINISTRATIVE","POLICE DE LA CIRCULATION ROUTIERE","ORGANISATION ET STATUS","CORRESPONDANCE MILITAIRE","MAINTIEN DE L’ORDRE","DROIT INTERNATIONALE HUMANITAIRE","POLICE MILITAIRE","SERVICE DE LA GENDARMERIE","CULTURE GENERALE"]};
let SUBJECTS=[...PDF_SUBJECTS.DAP];
let state={page:"home",exam:"DAP",examSelected:false,subject:"",mode:"review",index:0,score:0,answered:false,selected:null,quiz:[],quizOptions:[],revealed:false,attemptId:null,pendingAnswers:[],session:null,profile:null,progress:null,authMode:"login",isAdmin:false};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const sb=window.supabase?.createClient?.(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const isConfigured=()=>Boolean(sb&&SUPABASE_PUBLISHABLE_KEY&&SUPABASE_PUBLISHABLE_KEY.startsWith("sb_"));
function phoneNormalize(raw){const d=String(raw||"").replace(/\D/g,"");const n=d.startsWith("221")?d.slice(3):d;return /^(70|75|76|77|78)\d{7}$/.test(n)?"+221"+n:null;}
function authEmailFromPhone(phone){return phone.replace(/\D/g,"")+"@auth.lukos.sn";}
function subjectKey(value){return String(value??"").trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’‘`´]/g,"'").replace(/\s+/g," ").toUpperCase();}
async function loadSubjects(exam=state.exam){
  if(!state.profile||state.profile.account_status!=="active")return SUBJECTS;
  SUBJECTS=[...(PDF_SUBJECTS[exam]||[])];
  return SUBJECTS;
}
function questionsForSubject(subject){const key=subjectKey(subject);return QUESTIONS.filter(q=>subjectKey(q.matiere)===key);}
function setPage(p){if(p==="admin"&&!state.isAdmin){state.page="home";render();return;}state.page=p;state.index=0;state.score=0;state.answered=false;state.selected=null;state.revealed=false;if(p==="quiz"){state.mode="setup";state.subject="";}render();window.scrollTo(0,0);}
async function getSession(){if(!isConfigured())return null;const {data}=await sb.auth.getSession();return data.session||null;}
async function loadProfile(){if(!state.session)return null;const {data,error}=await sb.from("profiles").select("id,first_name,last_name,phone,role,account_status").eq("id",state.session.user.id).maybeSingle();if(error)throw error;state.profile=data||null;state.isAdmin=Boolean(state.profile&&state.profile.role==="admin"&&state.profile.account_status==="active"&&String(state.session.user.email||"").toLowerCase()===ADMIN_EMAIL);const an=document.getElementById("adminNav");if(an)an.style.display=state.isAdmin?"block":"none";const lo=document.getElementById("logoutNav");if(lo)lo.style.display=state.session?"block":"none";return state.profile;}
async function loadQuestions(exam=state.exam,force=false){
  if(!state.profile||state.profile.account_status!=="active")return [];
  if(!force&&QUESTION_CACHE[exam]){QUESTIONS.length=0;QUESTIONS.push(...QUESTION_CACHE[exam]);return QUESTIONS;}
  const subjects=PDF_SUBJECTS[exam]||[];
  const rows=[];const pageSize=1000;let from=0;
  while(true){
    const {data,error}=await sb.from("lukos_questions")
      .select("id,subject,question,answer,source,exam_code")
      .eq("exam_code",exam)
      .in("subject",subjects)
      .order("id",{ascending:true})
      .range(from,from+pageSize-1);
    if(error)throw error;
    const batch=data||[];
    rows.push(...batch);
    if(batch.length<pageSize)break;
    from+=pageSize;
  }
  const unique=new Map();
  for(const r of rows){
    const question=String(r.question||"").trim();
    const answer=String(r.answer||"").trim();
    if(!question||!answer)continue;
    const key=question.toLowerCase().replace(/\s+/g," ").trim();
    const item={id:r.id,matiere:r.subject,question,reponse:answer,source:r.source||"",exam:exam};
    const previous=unique.get(key);
    // Quand plusieurs PDF contiennent la même question, conserver la version
    // qui possède la réponse la plus complète afin d’éviter les doublons.
    if(!previous||item.reponse.length>previous.reponse.length)unique.set(key,item);
  }
  const cleaned=[...unique.values()].sort((a,b)=>Number(a.id)-Number(b.id));
  QUESTION_CACHE[exam]=cleaned;
  QUESTIONS.length=0;QUESTIONS.push(...cleaned);
  return QUESTIONS;
}

function professionalQuizQuestion(q,answer){
  const raw=String(q||"").trim().replace(/[：:]+$/,"").trim();
  const ans=String(answer||"").trim();
  const low=ans.toLowerCase();
  if(!raw)return "Quelle est la question ?";
  if(/[?？]$/.test(raw))return raw;

  // Les formulations du PDF sont conservées dans la banque.
  // Ici, uniquement l'affichage du QUIZ est transformé en vraie question,
  // en tenant compte du sens attendu de la réponse.
  const term=raw.replace(/^[•\-–—\d.)]+\s*/,"").trim();
  const lowerTerm=term.charAt(0).toLowerCase()+term.slice(1);

  // Si le titre est déjà formulé comme une définition, on garde ce sens.
  if(/^définition\s+(?:de|d')\s*/i.test(term)){
    const subject=term.replace(/^définition\s+(?:de|d')\s*/i,"").trim();
    return "Quelle est la définition de "+subject+" ?";
  }

  // Détection du type de réponse : on cherche les marqueurs réellement présents
  // dans la réponse source, sans modifier ni compléter cette réponse.
  const isDefinition=/^(?:c'est|c’est|il s'agit de|il s’agit de|est|désigne|se définit|correspond à)\b/i.test(ans)
    || /\b(?:se définit comme|définition|définit)\b/i.test(low);
  const isRole=/\b(?:rôle|mission|missions|consiste à|consiste notamment à|a pour rôle|a pour mission)\b/i.test(low);
  const isConditions=/\b(?:conditions|condition)\b/i.test(low);
  const isElements=/\b(?:éléments|element|composantes|composante|caractéristiques|caractères)\b/i.test(low);
  const isCauses=/\b(?:causes|cause|raisons|motifs)\b/i.test(low);
  const isConsequences=/\b(?:conséquences|effets|résultats)\b/i.test(low);
  const isTypes=/\b(?:types|sortes|catégories|catégorie|formes)\b/i.test(low);
  const isMeasures=/\b(?:mesures|dispositions|actions)\b/i.test(low);

  if(isDefinition)return "Quelle est la définition de "+lowerTerm+" ?";
  if(isRole)return "Quel est le rôle de "+lowerTerm+" ?";
  if(isConditions)return "Quelles sont les conditions de "+lowerTerm+" ?";
  if(isElements)return "Quels sont les éléments de "+lowerTerm+" ?";
  if(isCauses)return "Quelles sont les causes de "+lowerTerm+" ?";
  if(isConsequences)return "Quelles sont les conséquences de "+lowerTerm+" ?";
  if(isTypes)return "Quels sont les types de "+lowerTerm+" ?";
  if(isMeasures)return "Quelles sont les mesures concernant "+lowerTerm+" ?";

  // La forme du titre apporte aussi une indication lorsque la réponse
  // n'explicite pas son type.
  if(/^(?:les|des)\s+(conditions|circonstances|mesures|autorités|infractions|causes|conséquences|qualités|règles|obligations|indications|hypothèses|sanctions|peines|étapes|sortes|catégories|modalités|dispositions|caractéristiques)\b/i.test(term))
    return "Quelles sont "+lowerTerm+" ?";
  if(/^(?:les|des)\s+(moments|éléments|effets|faits|états|actes|cas|principes|droits|devoirs|types|objectifs|moyens|caractères|termes|domaines|rôles|critères)\b/i.test(term))
    return "Quels sont "+lowerTerm+" ?";
  if(/^quel(?:le|s)?\s+/i.test(term))return term+" ?";
  if(/^qu'est-ce que\s+/i.test(term))return term+" ?";

  // Dernier recours : une formulation neutre et compréhensible,
  // plutôt qu'un simple intitulé présenté comme une question.
  return "Que signifie « "+term+" » ?";
}

 const r=await sb.from("lukos_questions").update({question:question.trim(),answer:answer.trim()}).eq("id",id);
 if(r.error){alert("Modification impossible : "+r.error.message);return;}
 q.question=question.trim();q.reponse=answer.trim();renderAdminQuestionResults();alert("Question et réponse modifiées.");
}
async function renderAdminContentSearch(){
 const box=document.getElementById("adminFolderView");if(!box)return;
 box.innerHTML="<div class=\"section-modern\"><button class=\"secondary\" id=\"backAdminSearch\">← DOSSIERS</button><div class=\"section-head-modern\" style=\"margin-top:14px\"><div><div class=\"section-title-modern\">🔎 RECHERCHE CONTENU</div><div class=\"muted\">Recherche dans les questions, réponses et matières.</div></div></div><input id=\"adminGlobalSearch\" placeholder=\"Ex. procédure, responsabilité…\" style=\"width:100%;box-sizing:border-box;margin-top:14px\"><div id=\"adminGlobalResults\" style=\"margin-top:14px\"></div></div>";

 await loadQuestions();
 document.getElementById("adminGlobalSearch").oninput=function(){const q=this.value.trim().toLowerCase(),out=document.getElementById("adminGlobalResults");if(q.length<2){out.innerHTML="<p class=\"muted\">Tape au moins 2 caractères.</p>";return;}const hits=QUESTIONS.filter(function(x){return String(x.question||"").toLowerCase().includes(q)||String(x.reponse||"").toLowerCase().includes(q)||String(x.matiere||"").toLowerCase().includes(q);}).slice(0,50);out.innerHTML=hits.length?hits.map(function(x){return "<div class=\"card\" style=\"margin-bottom:10px\"><span class=\"pill\">"+esc(x.matiere)+"</span><h3>"+esc(x.question)+"</h3><div class=\"answer\">"+esc(x.reponse)+"</div></div>";}).join(""):"<p class=\"muted\">Aucun résultat.</p>";};
}
async function loadAdminFolder(){
 const list=document.getElementById("folderList"),count=document.getElementById("folderCount");if(!list)return;list.innerHTML="<div class=\"card\">Chargement…</div>";
 const a=await sb.from("profiles").select("id,first_name,last_name,phone,role,account_status,created_at").neq("role","admin").order("created_at",{ascending:false}),b=await sb.from("payments").select("id,user_id,amount_xof,method,status,created_at,transaction_reference").order("created_at",{ascending:false});
 if(a.error||b.error){list.innerHTML="<div class=\"card\"><p>"+esc((a.error||b.error).message)+"</p></div>";return;}
 const profiles=a.data||[],payments=b.data||[];window.__adminProfiles=profiles;window.__adminPayments=payments;const latest=new Map();payments.forEach(function(p){if(!latest.has(p.user_id))latest.set(p.user_id,p);});
 const folder=adminFolders.find(function(f){return f.id===adminState.folder;});
 const rows=profiles.map(function(p){return {p:p,pay:latest.get(p.id)};}).filter(function(x){return folder.type==="payment"?(x.pay&&x.pay.status===(folder.id==="rejected-payments"?"rejected":folder.id)):(x.p.account_status===folder.id);});
 count.textContent=rows.length+" enregistrement(s) dans ce dossier.";
 if(!rows.length){list.innerHTML="<div class=\"card\" style=\"text-align:center;padding:28px\"><div style=\"font-size:42px\">📭</div><h3>Dossier vide</h3><p class=\"muted\">Aucun élément ne correspond à cet état.</p></div>";return;}
 if(adminState.receiptFolder){
   const withPay=rows.filter(function(x){return x.pay;});
   list.innerHTML="<div class=\"card\" style=\"margin-bottom:12px\"><b>🧾 DOSSIER DES REÇUS</b><p class=\"muted\">Les reçus sont regroupés ici, séparés de la liste des candidats.</p></div>"+withPay.map(function(x){const p=x.p,pay=x.pay,name=((p.first_name||"")+" "+(p.last_name||"")).trim()||"Candidat";return "<div class=\"card\" style=\"margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap\"><div><h3 style=\"margin:0 0 5px\">🧾 "+esc(name)+"</h3><p class=\"muted\" style=\"margin:0\">"+Number(pay.amount_xof||0).toLocaleString("fr-FR")+" FCFA · "+esc(pay.method==="wave"?"Wave":pay.method==="orange_money"?"Orange Money":pay.method)+" · "+esc(statusLabel(pay.status))+"</p></div><button class=\"primary invoiceBtn\" data-user=\""+esc(p.id)+"\" data-pay=\""+esc(pay.id)+"\">Ouvrir / imprimer</button></div>";}).join("");
   document.querySelectorAll(".invoiceBtn").forEach(function(btn){btn.onclick=function(){openInvoice(btn.dataset.user,btn.dataset.pay);};});return;
 }
 list.innerHTML=rows.map(function(x){const p=x.p,pay=x.pay,name=((p.first_name||"")+" "+(p.last_name||"")).trim()||"Candidat",ps=p.account_status||"pending",qs=pay?pay.status:"none",amount=pay?Number(pay.amount_xof||0).toLocaleString("fr-FR")+" FCFA":"Aucun paiement",method=pay?(pay.method==="wave"?"Wave":pay.method==="orange_money"?"Orange Money":pay.method):"—";let actions="";
 if(pay&&qs==="pending")actions+='<button class="primary validatePay" data-id="'+esc(pay.id)+'">✓ ACCEPTER & ACTIVER</button><button class="secondary rejectPay" data-id="'+esc(pay.id)+'">✕ REJETER LE PAIEMENT</button>';
 if(ps==="active")actions+='<button class="secondary statusBtn" data-user="'+esc(p.id)+'" data-status="suspended">⏸ SUSPENDRE</button>';if(ps==="pending")actions+='<button class="secondary statusBtn" data-user="'+esc(p.id)+'" data-status="pending">⏳ MAINTENIR EN ATTENTE</button>';actions+='<button class="secondary deleteAccount" data-user="'+esc(p.id)+'">🗑️ SUPPRIMER LE COMPTE</button>';
 if(ps==="suspended"||ps==="rejected")actions+='<button class="secondary statusBtn" data-user="'+esc(p.id)+'" data-status="active">✓ ACTIVER</button>';
 if(ps==="active"||ps==="pending")actions+='<button class="secondary statusBtn" data-user="'+esc(p.id)+'" data-status="rejected">✕ REJETER</button>';
 return '<div class="card" style="margin-bottom:14px;border-radius:20px"><span class="pill" style="color:'+statusTone(qs)+'">Paiement : '+esc(statusLabel(qs))+'</span><span class="pill" style="color:'+statusTone(ps)+'">Compte : '+esc(statusLabel(ps))+'</span><h3 style="margin:10px 0 5px">'+esc(name)+'</h3><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0"><span style="font-size:18px">📱</span><a href="tel:'+esc(p.phone||"")+'" style="font-size:18px;font-weight:950;color:#075ec0;text-decoration:none">'+esc(p.phone||"—")+'</a><button class="secondary copyPhone" data-phone="'+esc(p.phone||"")+'" style="padding:7px 10px">Copier</button></div><p class="muted">Inscription : '+esc(new Date(p.created_at).toLocaleString("fr-FR"))+'</p><p class="muted"><b>'+esc(amount)+'</b> · '+esc(method)+'</p><div style="display:grid;gap:9px;margin-top:12px">'+actions+'</div></div>';}).join("");
 document.querySelectorAll(".validatePay").forEach(function(b){b.onclick=function(){approvePayment(b.dataset.id);};});
 document.querySelectorAll(".rejectPay").forEach(function(b){b.onclick=function(){rejectPayment(b.dataset.id);};});
 document.querySelectorAll(".statusBtn").forEach(function(b){b.onclick=function(){setCandidateStatus(b.dataset.user,b.dataset.status);};});document.querySelectorAll(".deleteAccount").forEach(function(b){b.onclick=function(){deleteCandidateAccount(b.dataset.user);};});document.querySelectorAll(".copyPhone").forEach(function(b){b.onclick=async function(){try{await navigator.clipboard.writeText(b.dataset.phone||"");b.textContent="Copié ✓";setTimeout(function(){b.textContent="Copier";},1400);}catch(e){alert("Impossible de copier le numéro.");}};});
}
async function deleteCandidateAccount(id){if(!state.isAdmin)return;if(!confirm("ATTENTION : cette suppression est définitive et supprime le compte candidat. Continuer ?"))return;const r=await sb.rpc("delete_candidate_account",{p_user_id:id});if(r.error){alert("Suppression impossible : "+r.error.message);return;}alert("Compte supprimé définitivement.");await loadAdminStats();renderAdminFolders();if(adminState.folder!=="home")loadAdminFolder();}
async function setCandidateStatus(id,status){const labels={pending:"remettre en attente",active:"activer",suspended:"suspendre",rejected:"rejeter"};if(!labels[status])return;if(!confirm("Confirmer : "+labels[status]+" ce compte ?"))return;const r=await sb.rpc("set_candidate_status",{p_user_id:id,p_status:status});if(r.error){alert("Modification impossible : "+r.error.message);return;}await loadAdminStats();renderAdminFolders();if(adminState.folder!=="home")loadAdminFolder();}
async function rejectPayment(id){if(!confirm("Confirmer le rejet de ce paiement ? Le paiement restera conservé dans le dossier REJETÉS."))return;const b=[...document.querySelectorAll(".rejectPay")].find(function(x){return x.dataset.id===id;});if(b)b.disabled=true;const r=await sb.rpc("reject_candidate_payment",{p_payment_id:id});if(r.error){if(b)b.disabled=false;alert("Rejet du paiement impossible.\n\n"+r.error.message+"\n\nExécute le correctif SQL de rejet dans Supabase puis réessaie.");return;}alert("Paiement rejeté et compte placé dans le dossier REJETÉS.");await loadAdminStats();renderAdminFolders();if(adminState.folder!=="home")loadAdminFolder();}
async function approvePayment(id){if(!confirm("Confirmer ce paiement et activer le compte du candidat ?"))return;const b=[...document.querySelectorAll(".validatePay")].find(function(x){return x.dataset.id===id;});if(b)b.disabled=true;const r=await sb.rpc("approve_candidate_payment",{p_payment_id:id});if(r.error){alert("Activation impossible : "+r.error.message);if(b)b.disabled=false;return;}alert("Paiement accepté et compte activé.");await loadAdminStats();renderAdminFolders();if(adminState.folder!=="home")loadAdminFolder();}
